name: 回测记分牌到期巡检

on:
  schedule:
    # 每周一 UTC 02:30 = 北京时间 10:30
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scoreboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检查逾期 / 14 天内到期节点
        id: sb
        run: |
          OUT=$(python3 scripts/check_scoreboard.py --due-only || true)
          if [ -n "$OUT" ]; then
            echo "$OUT"
            printf '%s\n' "$OUT" > /tmp/scoreboard.txt
            echo "urgent=1" >> $GITHUB_OUTPUT
          else
            echo "无逾期/临近节点（平时安静）"
            echo "urgent=0" >> $GITHUB_OUTPUT
          fi

      - name: 有到期节点则开提醒 Issue（去重防刷屏）
        if: steps.sb.outputs.urgent == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 已有未关闭的同类 Issue 就跳过，避免每周重复开单
          OPEN=$(gh issue list --state open --search '【记分牌巡检】 in:title' --json number --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "已有 $OPEN 个未关闭的记分牌提醒，跳过本次创建"
            exit 0
          fi
          {
            echo "## 回测记分牌到期提醒"
            echo
            echo '```'
            cat /tmp/scoreboard.txt
            echo '```'
            echo
            echo "处理完请勾选 SCOREBOARD 对应节点的完成标记，并补采数据；规则见 \`scoreboard/\` 目录与 \`scripts/check_scoreboard.py\`。"
          } > /tmp/body.md
          TITLE="【记分牌巡检】$(date +%F) 有逾期/临近节点"
          if ! gh issue create --title "$TITLE" --body-file /tmp/body.md --label "scoreboard"; then
            echo "::warning::label 'scoreboard' 不可用，降级为不带 label 创建"
            gh issue create --title "$TITLE" --body-file /tmp/body.md
          fi
