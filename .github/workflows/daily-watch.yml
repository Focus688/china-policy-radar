name: 政策巡检

on:
  schedule:
    # 每天 UTC 01:00 = 北京时间 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 巡检新政策
        id: watch
        run: |
          if [ ! -f state/seen.json ]; then
            python3 scripts/watch_gov.py --mark-seen > /dev/null
            echo "首次运行，已建立基线"
            echo "new_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          # 只巡检、不推进状态：状态必须等通知成功后再落（红队审计修复 2026-10-27）
          python3 scripts/watch_gov.py > /tmp/result.json
          cat /tmp/result.json
          python3 - <<'EOF' >> $GITHUB_OUTPUT
          import json
          d = json.load(open('/tmp/result.json'))
          print(f"new_count={d['new_count']}")
          EOF

      - name: 有新政策则开 Issue
        if: steps.watch.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF' > /tmp/body.md
          import json
          d = json.load(open('/tmp/result.json'))
          print(f"巡检日期：{d['checked']}\n")
          print(f"发现 **{d['new_count']}** 条新政策，请评估是否收录：\n")
          for it in d["new"]:
              print(f"- [{it['title']}]({it['url']})  ")
              print(f"  `{it.get('date') or '日期未解析'}` · 发文字号 `{it.get('doc_number') or '—'}` · 命中关键词 `{it['matched_keyword']}`")
          EOF
          TITLE="【政策巡检】$(date +%F) 发现 ${{ steps.watch.outputs.new_count }} 条新政策"
          # 带 label 失败只允许降级为「不带 label 重试」；两次都失败必须让 job 变红。
          if ! gh issue create --title "$TITLE" --body-file /tmp/body.md --label "policy-watch"; then
            echo "::warning::label 'policy-watch' 不可用，降级为不带 label 创建"
            gh issue create --title "$TITLE" --body-file /tmp/body.md
          fi

      - name: 通知成功后才推进状态
        if: success() && steps.watch.outputs.new_count != '0'
        run: python3 scripts/watch_gov.py --mark-seen-only /tmp/result.json

      - name: 提交状态文件
        if: success()
        run: |
          git config user.name "policy-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/seen.json
          git diff --staged --quiet || git commit -m "chore: 更新政策巡检状态 $(date +%F)"
          git push
