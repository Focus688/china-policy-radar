name: 重建索引

# data/ 或 catalog/ 有变更时自动重建 index.json 并提交，
# 消灭「清单加了、机器可读层忘了跑」这类漂移。
on:
  push:
    paths:
      - "data/**"
      - "catalog/**"
      - "scripts/build_index.py"
      - "scripts/build_stubs.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成 stub（幂等，已存在则跳过）
        run: python3 scripts/build_stubs.py

      - name: 重建 index.json
        run: python3 scripts/build_index.py

      - name: 有变化则提交
        run: |
          git config user.name "policy-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.json data/
          if git diff --staged --quiet; then
            echo "index 已最新，无需提交"
          else
            git commit -m "chore: 重建 index.json ($(date +%F))"
            git push
          fi
